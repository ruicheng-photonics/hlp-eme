[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlp-eme"
version = "0.1.0"
description = "HLP-EME simulation tools for integrated Bragg gratings"
requires-python = ">=3.13.5"

dependencies = [
    "numpy>=2.5.1",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
    "h5py>=3.16.0",
    ]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]